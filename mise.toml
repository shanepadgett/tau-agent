[tools]
node = "24.18.0"
"npm:oxfmt" = "0.62.0"
"npm:oxlint" = "1.77.0"
"npm:markdownlint-cli2" = "0.22.1"
"npm:fallow" = "2.100.0"
"npm:tree-sitter-cli" = "0.26.11"

[env]
NODE_USE_SYSTEM_CA = "1"
# Agent-default fallow output: one line per finding, no progress spam.
# Override per invocation with --format / --quiet false when needed.
FALLOW_FORMAT = "compact"
FALLOW_QUIET = "1"

[settings]
jobs = 1
task_output = "quiet"
# Always prepend mise tool paths when composing task/exec PATH. Without this,
# mise re-inserts node where a previous shell activation left it — which can
# land after /opt/homebrew/bin, so tasks silently run Homebrew node/npm and
# npm ls fails the devEngines npm pin ("stale dependencies" false alarm).
activate_aggressive = true

[tasks.check]
description = "Run all checks"
depends = ["check:ts", "check:md", "check:mise"]

[tasks."check:mise"]
description = "Validate mise tasks (cycles, missing refs, run entries)"
run = "mise tasks validate --errors-only"

[tasks."check:ts"]
description = "TS and config checks"
depends = [
	"check:dependencies",
	"check:schema",
	"check:fmt",
	"check:lint",
	"check:types",
	"test:unit",
	"fallow:dead-code",
	"fallow:dupes",
]

[tasks."check:dependencies"]
description = "Check installed dependency tree"
run = '''
if ! npm ls --depth=0 --loglevel=silent >/dev/null 2>&1; then
  echo "Dependency installation is stale or incomplete. Run: npm ci --ignore-scripts" >&2
  exit 1
fi
'''

[tasks."check:md"]
description = "Markdown checks"
depends = ["check:markdown"]

[tasks.generate-schema]
description = "Generate Tau settings schema"
run = "node --experimental-strip-types packages/agent/scripts/generate-tau-schema.ts --write"

[tasks."check:schema"]
description = "Check Tau settings schema drift"
run = "node --experimental-strip-types packages/agent/scripts/generate-tau-schema.ts --check"

[tasks."check:fmt"]
description = "Format TypeScript with Oxfmt"
run = "oxfmt --write 'packages/**/*.ts' '.pi/extensions/**/*.ts'"

[tasks."check:lint"]
description = "Lint TypeScript with Oxlint"
run = "oxlint --fix --format=agent packages .pi/extensions"

[tasks."check:style"]
description = "Format and lint TypeScript"
depends = ["check:fmt", "check:lint"]

[tasks."check:markdown"]
description = "Run Markdown checks"
run = "markdownlint-cli2 --fix"

[tasks."check:types"]
description = "Run TypeScript checks"
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test:unit"]
description = "Run unit tests"
run = "./node_modules/.bin/vitest --run --reporter=agent"

[tasks."check:deadcode"]
description = "Fallow dead-code + duplication (convenience aggregate)"
depends = ["fallow:dead-code", "fallow:dupes"]

[tasks.fallow]
description = "Full fallow gate: dead-code + dupes hard-fail, health score >= 75"
# fallow health --min-score still exits 1 when complexity findings exist (fallow 2.100).
# Score-gate via JSON + report-only until that is fixed upstream.
run = """
fallow dead-code --fail-on-issues
fallow dupes --fail-on-issues
score="$(env -u FALLOW_QUIET -u FALLOW_FORMAT fallow health --score --report-only --format json --quiet | python3 -c 'import json,sys; print(json.load(sys.stdin)["health_score"]["score"])')"
python3 -c 'import sys; score=float(sys.argv[1]); print(f"health-score:{score}"); sys.exit(0 if score >= 75 else 1)' "$score"
"""

[tasks."fallow:dead-code"]
description = "Fallow unused code, cycles, unresolved imports (compact)"
run = "fallow dead-code --fail-on-issues"

[tasks."fallow:dupes"]
description = "Fallow code duplication (compact)"
run = "fallow dupes --fail-on-issues"

[tasks."fallow:health"]
description = "Fallow complexity debt report (advisory; exit 1 while findings remain)"
run = "fallow health --complexity --hotspots --targets"

[tasks."fallow:audit"]
description = "Fallow changed-files gate, new-only (compact)"
run = "fallow audit"

[tasks."fallow:list"]
description = "Fallow discovery: entries, workspaces, plugins, boundaries (compact)"
run = "fallow list --entry-points --workspaces --plugins --boundaries"

[tasks."fallow:json"]
description = "Full fallow analysis as JSON (structured / actions)"
run = "fallow --format json --quiet"

[tasks."fallow:human"]
description = "Full fallow analysis as human-readable terminal output"
run = "FALLOW_FORMAT=human FALLOW_QUIET=0 fallow --format human"

[tasks."grammars:build"]
description = "Rebuild vendored tree-sitter grammar wasm artifacts"
run = "node --experimental-strip-types packages/agent/scripts/build-grammars.ts"
