[tools]
bun = "1.4.3"
# Only for tools/ unit tests: oxlint's RuleTester does not run under Bun (AGENTS.md).
node = "24.21.0"

[env]
# One line per Fallow finding, without progress output or log warnings.
FALLOW_FORMAT = "compact"
FALLOW_QUIET = "1"
RUST_LOG = "error"

[settings]
# Type checking and type-aware lint each use several GiB on large trees; run
# tasks one at a time.
jobs = 1
# Checks print only failures: no echo of each task's command.
task.quiet = true

# Every JS tool runs from node_modules under Bun. --no-install fails instead of
# downloading a missing tool. Commands whose output has passing noise run through
# tools/report-failures.ts, which prints nothing on success and only failures otherwise.

[tasks.check]
description = "Run every read-only check"
depends = [
  "check:mise",
  "check:fmt",
  "check:lint",
  "check:types",
  "check:reference",
  "check:file-names",
  "fallow:dead-code",
  "fallow:dupes",
  "test",
  "test:rules",
]

[tasks."check:mise"]
description = "Validate mise tasks"
run = "bun tools/report-failures.ts plain -- mise tasks validate --errors-only"

[tasks."check:file-names"]
description = "Git tracks each file under its name on disk; src/ file names follow the layer layout"
run = "bun tools/file-names-check.ts"

[tasks."check:types"]
description = "Type and Effect diagnostics with the patched TypeScript compiler"
run = "bunx --bun --no-install tsc --noEmit"

[tasks."check:lint"]
description = "Oxlint, type-aware rules and the Tau plugin"
run = "bunx --bun --no-install oxlint --type-aware --deny-warnings --disable-nested-config --format=agent src tools tests"

[tasks."check:fmt"]
description = "Check formatting with Oxfmt"
run = "bunx --bun --no-install oxfmt --list-different"

[tasks."fix:lint"]
description = "Apply safe Oxlint fixes to the supplied files"
run = "bunx --bun --no-install oxlint --type-aware --disable-nested-config --format=agent --fix"

[tasks."fix:fmt"]
description = "Format the supplied files with Oxfmt"
run = "bunx --bun --no-install oxfmt --write"

[tasks."fallow:dead-code"]
description = "Unused files, exports and dependencies, cycles and import boundaries"
run = "bun tools/report-failures.ts fallow -- bunx --bun --no-install fallow dead-code --fail-on-issues"

[tasks."fallow:dupes"]
description = "Duplicated code"
run = "bun tools/report-failures.ts fallow -- bunx --bun --no-install fallow dupes --fail-on-issues"

[tasks.test]
description = "Application tests of the files changed since the last commit, run after agent runs"
# Only test files that import a changed file run. A test slower than one second sets its own timeout.
run = "bun tools/report-failures.ts bun-test -- bun test ./src ./tests --path-ignore-patterns 'tests/binary/**' --only-failures --parallel --timeout 1000 --changed"

[tasks."test:all"]
description = "Every application test, run before commit"
run = "bun tools/report-failures.ts bun-test -- bun test ./src ./tests --path-ignore-patterns 'tests/binary/**' --only-failures --parallel --timeout 1000"

[tasks."test:binary"]
description = "Compiled-binary tests, run before commit"
run = "bun tools/report-failures.ts bun-test -- bun test ./tests/binary --only-failures"

[tasks."test:rules"]
description = "Lint rule unit tests under Node"
run = "bun tools/report-failures.ts node-test -- node --test --test-reporter=dot \"tools/lint/**/*.test.ts\""

[tasks.dev]
description = "Open the chat from source; it restarts into each change in src/"
# The chat reads the terminal's keys, so it gets the terminal directly.
raw = true
run = "bun src/cli/main.ts"

[tasks.gallery]
description = "Open the design gallery, where new front-end designs are approved"
# The gallery reads the terminal's keys, so it gets the terminal directly.
raw = true
run = "bun src/tui/Gallery.ts"

[tasks.catalog]
description = "Refresh the model catalog snapshot bundled in the binary"
run = ["bun tools/catalog-snapshot.ts", "mise run fix:fmt -- src/ai/catalog-snapshot.json"]

[tasks.docs]
description = "Copy version-matched dependency docs into docs/reference/copies/ and rebuild the index"
run = "bun tools/reference-docs.ts"

[tasks."check:reference"]
description = "Every dependency has reference docs matching its pinned version"
run = "bun tools/reference-check.ts"
