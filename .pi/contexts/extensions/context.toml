name = "Context"
description = "Reusable repository context selection, ephemeral projection, and maintenance"

[catalog]
description = "Context catalog model, loading-mode policy, path eligibility, validation, and settings"
read = [
	"packages/agent/extensions/context/definitions.ts",
	"packages/agent/extensions/context/validation.ts",
	"packages/agent/extensions/context/settings.ts",
]
outline = []
references = ["packages/agent/extensions/context/README.md"]

[selection]
description = "One-time tabbed selection, loading-mode precedence, and file-injection projection"
read = ["packages/agent/extensions/context/index.ts", "packages/agent/extensions/context/panel.ts"]
outline = []
references = ["packages/agent/extensions/context/README.md"]

[synchronization]
description = "Context-sync orchestration, evidence, subagent handoff, write-scope restoration, and verification"
read = ["packages/agent/extensions/context/sync.ts", "packages/agent/extensions/context/write-scope.ts"]
outline = ["packages/agent/extensions/context/evidence.ts"]
references = ["packages/agent/extensions/context/README.md"]

[documentation]
description = "Context management guidance, catalog taxonomy, and extension usage"
read = ["packages/agent/docs/context.md"]
outline = []
references = ["packages/agent/extensions/context/README.md"]
