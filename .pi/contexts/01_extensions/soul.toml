name = "Soul"
description = "Build Tau's system prompt as Pi prompt sections from collected prompt sources, freezing compaction-refreshed sources per compaction epoch"

[prompt-lifecycle]
description = "In before_agent_start set the fixed instructions as customPrompt, add documentation, tool guidance and prompt sources as named sections, save compaction-refreshed source values in a custom entry per compaction epoch, and emit the prompt snapshot"
read = [
  "packages/agent/extensions/soul/index.ts",
  "packages/agent/extensions/soul/prompt.ts",
  "packages/agent/extensions/soul/README.md",
  "packages/agent/shared/prompt-contributions.ts",
  "packages/agent/shared/events.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/runtime-context/index.ts",
  "packages/agent/extensions/explore/guidance.ts",
  "packages/agent/extensions/tau-help/index.ts",
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/tool-approval/index.ts",
  "packages/agent/extensions/tool-loader/index.ts",
]

[source-collection]
description = "Register, validate, and collect extension-owned prompt sources that become named Soul prompt sections"
read = [
  "packages/agent/extensions/soul/index.ts",
  "packages/agent/shared/prompt-contributions.ts",
  "packages/agent/shared/events.ts",
  "packages/agent/extensions/soul/README.md",
]
show = []
outline = []
references = [
  "packages/agent/extensions/runtime-context/index.ts",
  "packages/agent/extensions/explore/guidance.ts",
  "packages/agent/extensions/tau-help/index.ts",
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/tool-approval/index.ts",
]
