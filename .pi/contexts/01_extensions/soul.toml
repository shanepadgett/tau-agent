name = "Soul"
description = "Capture and replay Soul's saved prompt baseline and updates, collect runtime prompt sources, and enforce cache-safe tool admission"

[prompt-lifecycle]
description = "Capture the sorted system-prompt baseline, persist source updates across compaction, replay the saved prefix, and reject unsafe tool or history changes"
read = [
  "packages/agent/extensions/soul/index.ts",
  "packages/agent/extensions/soul/context.ts",
  "packages/agent/extensions/soul/state.ts",
  "packages/agent/extensions/soul/tools.ts",
  "packages/agent/extensions/soul/prompt.ts",
  "packages/agent/extensions/soul/README.md",
  "packages/agent/shared/prompt-contributions.ts",
  "packages/agent/shared/events.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/runtime-context/index.ts",
  "packages/agent/extensions/explore/guidance.ts",
  "packages/agent/extensions/tau-help/index.ts",
  "packages/agent/extensions/subagent/index.ts",
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/tool-approval/index.ts",
  "packages/agent/extensions/tool-loader/index.ts",
]

[source-collection]
description = "Register, validate, read, sort, and render extension-owned prompt sources for Soul baseline capture and append-only updates"
read = [
  "packages/agent/extensions/soul/index.ts",
  "packages/agent/extensions/soul/context.ts",
  "packages/agent/shared/prompt-contributions.ts",
  "packages/agent/shared/events.ts",
  "packages/agent/extensions/soul/README.md",
]
show = []
outline = []
references = [
  "packages/agent/extensions/runtime-context/index.ts",
  "packages/agent/extensions/explore/guidance.ts",
  "packages/agent/extensions/tau-help/index.ts",
  "packages/agent/extensions/subagent/index.ts",
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/tool-approval/index.ts",
]
