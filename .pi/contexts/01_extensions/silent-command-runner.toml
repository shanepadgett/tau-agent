name = "Silent Command Runner"
description = "Automatic post-edit project commands with Soul automatic-check guidance, pass notifications, and failure continuations"

[extension-runtime]
description = "Load silentCommandRunner settings; register automatic-check guidance as a Soul source; snapshot project file set and time on agent_start; on agent_before_settle (completed outcome only) walk project, match include/exclude globs plus mtime/deleted paths since the snapshot, run changed commands via pi.exec sh -lc; pass notifies only; failures append a tau:silent-command-runner custom_message with stdout/stderr tails and continue the run, then reset the snapshot so only later agent changes trigger another check; abort in-flight on session_shutdown; custom message renderer for expanded failure details"
read = [
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/silent-command-runner/README.md",
  "packages/agent/shared/prompt-contributions.ts",
]
show = [
  { path = "packages/agent/shared/settings/load.ts", name = "loadTauExtensionSettings" },
  { path = "packages/agent/shared/settings/paths.ts", name = "resolveProjectRoot" },
  { path = "packages/agent/shared/glob.ts", name = "matchGlob" },
  { path = "packages/agent/shared/glob.ts", name = "posixPath" },
  { path = "packages/agent/shared/events.ts", name = "emitTauEvent" },
]
outline = []
references = [
  "packages/agent/extensions/silent-command-runner/settings.ts",
  "packages/agent/shared/settings/load.ts",
  "packages/agent/shared/settings/paths.ts",
  "packages/agent/shared/glob.ts",
  "packages/agent/shared/events.ts",
  "packages/agent/extensions/attention/index.ts",
  "packages/agent/extensions/tau-help/help.md",
]

[settings]
description = "silentCommandRunner.enabled, maxOutputBytes, and commands array: name, command, optional enabled cwd env details includeGlobs excludeGlobs timeoutMs"
read = [
  "packages/agent/extensions/silent-command-runner/settings.ts",
]
show = [
  { path = "packages/agent/shared/settings/define.ts", name = "defineTauExtensionSettings" },
]
outline = []
references = [
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/silent-command-runner/README.md",
  "packages/agent/shared/settings/define.ts",
]
