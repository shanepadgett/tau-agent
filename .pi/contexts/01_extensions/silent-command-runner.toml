name = "Silent Command Runner"
description = "Silent post-write fixes and end-of-run checks with Soul guidance, pass notifications, and failure continuations"

[extension-runtime]
description = "Load silentCommandRunner settings and register append-only Soul guidance; snapshot matching file hashes before modifying tools; await serialized afterWrite fixes after tool_result, grouping descendants under their outer call and passing changed paths through shell positional arguments; snapshot project file set and time on agent_start; on agent_before_settle run matching afterRun checks via pi.exec sh -lc; pass notifies only; failures append a tau:silent-command-runner message and continue the run; reset the check baseline after failures; abort processes on shutdown"
read = [
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/silent-command-runner/README.md",
  "packages/agent/shared/prompt-contributions.ts",
]
show = [
  { path = "packages/agent/shared/settings/load.ts", name = "loadTauExtensionSettings" },
  { path = "packages/agent/shared/settings/paths.ts", name = "resolveProjectRoot" },
  { path = "packages/agent/shared/glob.ts", name = "matchGlob" },
  { path = "packages/agent/shared/glob.ts", name = "posixPath" },
  { path = "packages/agent/shared/events.ts", name = "emitTauEvent" },
]
outline = []
references = [
  "packages/agent/extensions/silent-command-runner/settings.ts",
  "packages/agent/shared/settings/load.ts",
  "packages/agent/shared/settings/paths.ts",
  "packages/agent/shared/glob.ts",
  "packages/agent/shared/events.ts",
  "packages/agent/extensions/attention/index.ts",
  "packages/agent/extensions/tau-help/help.md",
]

[settings]
description = "silentCommandRunner.maxOutputBytes, afterWrite, and afterRun arrays: name, command, optional cwd env details includeGlobs excludeGlobs timeoutMs; unquoted {files} passes changed paths to afterWrite commands; disable through Pi extension controls"
read = [
  "packages/agent/extensions/silent-command-runner/settings.ts",
]
show = [
  { path = "packages/agent/shared/settings/define.ts", name = "defineTauExtensionSettings" },
]
outline = []
references = [
  "packages/agent/extensions/silent-command-runner/index.ts",
  "packages/agent/extensions/silent-command-runner/README.md",
  "packages/agent/shared/settings/define.ts",
]
