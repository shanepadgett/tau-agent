name = "Run Summary"
description = "Post-turn run cost and wall-time marker in the transcript"

[extension-runtime]
description = "Accumulate assistant costs across agent_end; on agent_settled append display-only tau.run-summary entry with wall time and run cost; render historical delegated costs when present; reset on session_start; entry never enters model context"
read = [
  "packages/agent/extensions/run-summary/index.ts",
  "packages/agent/extensions/run-summary/README.md",
]
show = [
  { path = "packages/tui/src/marker.ts", name = "Marker" },
]
outline = []
references = [
  "packages/agent/extensions/tau-help/help.md",
]
