name = "Review"
description = "Focused simplify, architecture, or correctness review of current Git changes or a user-directed repository area with Markdown output"

[command-lifecycle]
description = "Register trusted-TUI /review [direction], require a dirty Git tree only when direction is empty, choose a review type and deep provider or current-model fallback, run the isolated review, and write the Markdown result under .pi/tau/reviews/"
read = [
  "packages/agent/extensions/review/index.ts",
  "packages/agent/extensions/review/README.md",
  "packages/agent/extensions/review/model.ts",
  "packages/agent/shared/git.ts",
  "packages/agent/shared/model-effort.ts",
  "packages/agent/shared/text.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/review/session.ts",
  "packages/agent/extensions/tau-help/help.md",
]

[review-session]
description = "Resolve the selected review model, create an isolated print session with Explore tools and the terminating review_result tool, prompt it with the requested direction, propagate cancellation, and dispose the session"
read = [
  "packages/agent/extensions/review/session.ts",
  "packages/agent/extensions/review/model.ts",
  "packages/agent/shared/isolated-session.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/review/index.ts",
  "packages/agent/extensions/explore/index.ts",
]

[review-contract]
description = "Simplify, architecture, and correctness instructions; user-directed or Git-change scope; structured severity findings; review document metadata; and Markdown formatting"
read = [
  "packages/agent/extensions/review/model.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/review/index.ts",
  "packages/agent/extensions/review/session.ts",
  "packages/agent/extensions/review/README.md",
]
