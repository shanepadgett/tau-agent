name = "Commit"
description = "Interactive multi-commit planning from worktree evidence with review UI and git apply"

[command-lifecycle]
description = "Register /commit, gate on repo and TUI state, drive evidence→plan→review→apply, append session markers, optional push"
read = [
  "packages/agent/extensions/commit/index.ts",
  "packages/agent/extensions/commit/README.md",
]
show = [
  { path = "packages/agent/shared/git.ts", name = "createGitRunner" },
  { path = "packages/agent/shared/git.ts", name = "loadRepoStatus" },
  { path = "packages/agent/shared/agent-blocked.ts", name = "emitAgentBlocked" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "loadChangeSet" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "assertCommittableState" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "computeWorktreeSignature" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "stageFilesOnly" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "commitStaged" },
  { path = "packages/agent/extensions/commit/commit-plan.ts", name = "generatePlan" },
  { path = "packages/agent/extensions/commit/review-ui.ts", name = "reviewPlan" },
]
outline = []
references = [
  "packages/agent/extensions/commit/git-change-set.ts",
  "packages/agent/extensions/commit/commit-plan.ts",
  "packages/agent/extensions/commit/review-ui.ts",
  "packages/agent/shared/git.ts",
  "packages/agent/shared/text.ts",
]

[change-evidence]
description = "Parse dirty worktree, bound per-file diffs and untracked previews, collect session intent since last commit marker, fingerprint worktree, stage and commit selected paths"
read = [
  "packages/agent/extensions/commit/git-change-set.ts",
]
show = [
  { path = "packages/agent/shared/git.ts", name = "GitRunner", view = "declaration" },
  { path = "packages/agent/shared/text.ts", name = "truncAt" },
]
outline = []
references = [
  "packages/agent/extensions/commit/index.ts",
  "packages/agent/extensions/commit/commit-plan.ts",
  "packages/agent/extensions/commit/commit-effort.ts",
  "packages/agent/extensions/commit/review-ui.ts",
  "packages/agent/shared/git.ts",
]

[plan-generation]
description = "Build plan and message prompts from evidence, choose effort from change size, generate conventional commit groups via tool validation and single messages via text validation"
read = [
  "packages/agent/extensions/commit/commit-plan.ts",
  "packages/agent/extensions/commit/commit-effort.ts",
]
show = [
  { path = "packages/agent/shared/model-fallback/index.ts", name = "generateToolValidated" },
  { path = "packages/agent/shared/model-fallback/index.ts", name = "generateValidated" },
  { path = "packages/agent/shared/model-effort.ts", name = "resolveEffortCandidates" },
  { path = "packages/agent/shared/model-effort.ts", name = "ModelEffort", view = "declaration" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "CommitEvidence", view = "declaration" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "DirtyFile", view = "declaration" },
]
outline = []
references = [
  "packages/agent/extensions/commit/git-change-set.ts",
  "packages/agent/extensions/commit/index.ts",
  "packages/agent/extensions/commit/review-ui.ts",
  "packages/agent/shared/model-fallback/index.ts",
  "packages/agent/shared/model-effort.ts",
  "packages/agent/test/extensions/commit/commit-effort.test.ts",
]

[review-ui]
description = "TUI commit plan review: regroup or unassign files, edit messages, regenerate message or whole plan with notes, enforce conventional subjects before apply"
read = [
  "packages/agent/extensions/commit/review-ui.ts",
]
show = [
  { path = "packages/agent/extensions/commit/commit-plan.ts", name = "CommitGroup", view = "declaration" },
  { path = "packages/agent/extensions/commit/commit-plan.ts", name = "CommitPlanState", view = "declaration" },
  { path = "packages/agent/extensions/commit/commit-plan.ts", name = "generatePlan" },
  { path = "packages/agent/extensions/commit/commit-plan.ts", name = "regenerateMessage" },
  { path = "packages/agent/extensions/commit/commit-plan.ts", name = "requireCommitMessage" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "CommitEvidence", view = "declaration" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "DirtyFile", view = "declaration" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "loadChangeSet" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "computeWorktreeSignature" },
  { path = "packages/agent/extensions/commit/git-change-set.ts", name = "assertCommittableState" },
]
outline = []
references = [
  "packages/agent/extensions/commit/index.ts",
  "packages/agent/extensions/commit/commit-plan.ts",
  "packages/agent/extensions/commit/git-change-set.ts",
  "packages/agent/shared/text.ts",
]
