name = "Patch"
description = "Structured multi-file creation, editing, moving, deletion, and result rendering"

[application]
description = "Parse structured patch envelopes, match update chunks, and stage safe file mutations"
read = [
  "packages/agent/extensions/patch/parser.ts",
  "packages/agent/extensions/patch/matcher.ts",
  "packages/agent/extensions/patch/executor.ts",
  "packages/agent/extensions/patch/README.md",
]
show = []
outline = []
references = []

[tool-lifecycle]
description = "Register the patch tool, switch mutation tools by model, and format applied-change summaries"
read = [
  "packages/agent/extensions/patch/index.ts",
  "packages/agent/extensions/patch/summary.ts",
  "packages/agent/extensions/patch/README.md",
  "packages/agent/shared/tool-row-state.ts",
]
show = []
outline = []
references = [
  "packages/agent/shared/events.ts",
  "packages/agent/extensions/patch/executor.ts",
  "packages/agent/extensions/patch/render.ts",
]

[ui]
description = "Render streaming patch previews and applied-operation status rows"
read = [
  "packages/agent/extensions/patch/render.ts",
  "packages/agent/shared/tool-row-state.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/patch/executor.ts",
  "packages/agent/extensions/patch/summary.ts",
]

[scenarios]
description = "Scenario runner and fixture layout for patch operations"
read = [
  "packages/agent/test/extensions/patch/scenarios.test.ts",
  "packages/agent/test/extensions/patch/fixtures/scenarios/README.md",
]
show = []
outline = []
references = [
  "packages/agent/extensions/patch/executor.ts",
  "packages/agent/extensions/patch/parser.ts",
]
