name = "Appshot"
description = "macOS window discovery, PNG capture, and app activation tools"

[extension-shell]
description = "Register list_windows, screenshot_window, and activate_app in the deferred appshot group; macOS-only execution; tool-row state for list_windows title and expanded JSON; bound window-list JSON via DEFAULT_MAX_BYTES/LINES binary search; screenshot writes PNG under mutation queue with 12 MiB and PNG signature checks then returns inline image; activate_app foregrounds PID from list; clear row state on session_start"
read = [
  "packages/agent/extensions/appshot/index.ts",
  "packages/agent/extensions/appshot/README.md",
  "packages/agent/src/tool-loading/index.ts",
]
show = [
  { path = "packages/agent/extensions/appshot/native-helper.ts", name = "createNativeHelper" },
  { path = "packages/agent/extensions/appshot/native-helper.ts", name = "RunHelper", view = "declaration" },
  { path = "packages/agent/extensions/appshot/native-helper.ts", name = "HelperResult", view = "declaration" },
  { path = "packages/agent/shared/tool-row-state.ts", name = "createToolRowStateStore" },
  { path = "packages/agent/shared/tool-row-state.ts", name = "formatToolRowTitle" },
]
outline = []
references = [
  "packages/agent/extensions/appshot/native-helper.ts",
  "packages/agent/extensions/appshot/capture.swift",
  "packages/agent/shared/tool-row-state.ts",
  "packages/agent/extensions/tau-help/help.md",
]

[native-helper]
description = "Lazy-build and cache tau-appshot via xcrun swiftc for arm64/x86_64 macosx14; hash capture.swift into ~/Library/Caches/tau-agent/appshot; validate Mach-O 64 executable; rebuild after failed exec by deleting bad binary"
read = [
  "packages/agent/extensions/appshot/native-helper.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/appshot/index.ts",
  "packages/agent/extensions/appshot/capture.swift",
]

[capture-helper]
description = "Swift tau-appshot list|capture|activate: ScreenCaptureKit on-screen layer-0 windows as JSON; capture rescaled PNG fit within 1568×1568 ignoring shadows; activate NSRunningApplication by PID with screen-recording permission gates; macOS 14+"
read = [
  "packages/agent/extensions/appshot/capture.swift",
]
show = []
outline = []
references = [
  "packages/agent/extensions/appshot/native-helper.ts",
  "packages/agent/extensions/appshot/index.ts",
  "packages/agent/extensions/appshot/README.md",
]
