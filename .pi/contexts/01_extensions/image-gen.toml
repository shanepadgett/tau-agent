name = "Image Gen"
description = "Agent tool for OpenAI GPT Image and xAI Grok Imagine generate and edit"

[extension-shell]
description = "Register image_gen in the deferred image group: prompt plus optional provider openai|xai, path, and up to three referenced_image_paths; call generateImage; return path text and inline image when under 12 MiB attachment cap"
read = [
  "packages/agent/extensions/image-gen/index.ts",
  "packages/agent/extensions/image-gen/README.md",
  "packages/agent/src/tool-loading/index.ts",
  "packages/agent/src/index.ts",
]
show = [
  { path = "packages/agent/src/image-generation/index.ts", name = "generateImage" },
  { path = "packages/agent/src/image-generation/index.ts", name = "GenerateImageRequest", view = "declaration" },
  { path = "packages/agent/src/image-generation/index.ts", name = "GeneratedImageResult", view = "declaration" },
  { path = "packages/agent/src/image-generation/index.ts", name = "ImageGenerationContext", view = "declaration" },
  { path = "packages/agent/src/image-generation/constants.ts", name = "ImageProvider", view = "declaration" },
]
outline = []
references = [
  "packages/agent/src/image-generation/index.ts",
  "packages/agent/src/image-generation/client.ts",
  "packages/agent/src/image-generation/constants.ts",
  ".pi/contexts/02_core/image-generation.toml",
  "packages/agent/extensions/tau-help/help.md",
]
