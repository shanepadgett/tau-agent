name = "System Prompt Viewer"
description = "Local display-only snapshots of Soul's effective prompt and active tool schemas"

[command-lifecycle]
description = "Register /system-prompt-viewer toggle with system prompt footer marker; when enabled consume Soul prompt snapshots and append collapsible tau.system-prompt-viewer.snapshot custom messages with active tool parameter summaries; filter snapshots out of model context; cancel session_before_tree onto snapshot entries; clear enabled and footer on session_shutdown"
read = [
  ".pi/extensions/system-prompt-viewer/index.ts",
  ".pi/extensions/system-prompt-viewer/README.md",
  "packages/agent/shared/events.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/footer/index.ts",
]
