name = "Eval"
description = "Agent tool for fresh Python 3 and Node.js execution, bounded code previews, and edit-and-rerun on failure"

[extension-shell]
description = "Detect python3 and Node>=22.6 runtimes; register eval only when at least one exists; language=node is local Node.js via --experimental-strip-types; each call runs in a fresh process; new runs take full script and assign scriptId; failures keep up to 8 scripts in memory and return scriptId plus truncated diagnostics; retries apply exact oldText/newText edits then rerun; preview the first 10 source or diff lines while arguments stream, with syntax highlighting, overflow counts, and expansion; successes delete stored script and return bounded tail stdout; scrub temp paths from output; clear store and temporary output on session_shutdown"
read = [
  "packages/agent/extensions/eval/index.ts",
  "packages/agent/extensions/eval/README.md",
]
show = []
outline = []
references = [
  "packages/agent/extensions/tau-help/help.md",
]
