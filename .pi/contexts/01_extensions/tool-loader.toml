name = "Tool Loader"
description = "Keep specialist tool groups deferred and reachable through Pi's tool_search on all models"

[extension-runtime]
description = "registerDeferredToolGroup registers tools with deferred exposure and a group namespace; at session_start activate tool_search when any deferred tool exists, or warn when the built-in extension is disabled; allow Pi to load tools on all models even when activation invalidates the cached prefix"
read = [
  "packages/agent/extensions/tool-loader/index.ts",
  "packages/agent/extensions/tool-loader/README.md",
  "packages/agent/src/tool-loading/index.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/tau-help/help.md",
]
