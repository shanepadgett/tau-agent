name = "Context"
description = "Reusable repository context selection and one-time injection"

[extension-shell]
description = "Register /context and inject selected catalog entries into the conversation once"
read = [
  "packages/agent/extensions/context/index.ts",
  "packages/agent/extensions/context/README.md",
]
show = [
  { path = "packages/agent/src/file-injection/index.ts", name = "prepareFileInjection" },
]
outline = []
references = [
  "packages/agent/extensions/context/definitions.ts",
  "packages/agent/extensions/context/panel.ts",
  "packages/agent/src/file-injection/index.ts",
  "packages/agent/docs/context.md",
]

[catalog]
description = "Load `.pi/contexts` domain/concept/entry TOML packs into selectable entries"
read = [
  "packages/agent/extensions/context/definitions.ts",
]
show = []
outline = []
references = [
  "packages/agent/docs/context.md",
  "packages/agent/extensions/context/README.md",
  "packages/agent/test/extensions/explore/context-pack.test.ts",
]

[selection-ui]
description = "Browse and select context entries in a tabbed multi-select panel"
read = [
  "packages/agent/extensions/context/panel.ts",
]
show = [
  { path = "packages/agent/extensions/context/definitions.ts", name = "ContextEntry", view = "declaration" },
]
outline = []
references = [
  "packages/agent/extensions/context/index.ts",
  "packages/agent/extensions/context/definitions.ts",
]

[documentation]
description = "Catalog taxonomy, loading-mode policy, and the /context command"
read = [
  "packages/agent/docs/context.md",
  "packages/agent/extensions/context/README.md",
]
show = []
outline = []
references = [
  "packages/agent/extensions/context/definitions.ts",
]
