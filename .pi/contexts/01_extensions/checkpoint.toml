name = "Checkpoint"
description = "Rolling working checkpoints that preserve focused agent context while disposable history is retired"

[extension-shell]
description = "Lifecycle glue: settings load, budget instance, notices, tool gate, context hook, visibility flag"
read = [
  "packages/agent/extensions/checkpoint/index.ts",
  "packages/agent/extensions/checkpoint/settings.ts",
  "packages/agent/extensions/checkpoint/checkpoint-budget.ts",
  "packages/agent/shared/checkpoint-visibility.ts",
  "packages/agent/extensions/checkpoint/README.md",
]
show = []
outline = []
references = [
  "packages/agent/extensions/checkpoint/checkpoint.ts",
  "packages/agent/extensions/checkpoint/messages.ts",
  "packages/agent/shared/settings/load.ts",
]

[checkpoint-tool]
description = "checkpoint tool implementation: schema, keepMessages, continuation, file injection, TUI row"
read = [
  "packages/agent/extensions/checkpoint/checkpoint.ts",
  "packages/agent/extensions/checkpoint/messages.ts",
  "packages/agent/shared/checkpoint-visibility.ts",
  "packages/agent/extensions/checkpoint/README.md",
]
show = [
  { path = "packages/agent/src/file-injection/index.ts", name = "prepareFileInjection" },
  { path = "packages/agent/src/file-injection/index.ts", name = "FileInjectionFile", view = "declaration" },
  { path = "packages/agent/src/file-injection/index.ts", name = "FileInjectionRequest", view = "declaration" },
]
outline = []
references = [
  "packages/agent/src/file-injection/index.ts",
  "packages/agent/extensions/checkpoint/index.ts",
  "packages/agent/shared/events.ts",
]

[context-projection]
description = "Rebuild provider context after checkpoint and stamp keepMessages message ids"
read = [
  "packages/agent/extensions/checkpoint/messages.ts",
  "packages/agent/extensions/checkpoint/checkpoint.ts",
  "packages/agent/extensions/checkpoint/README.md",
]
show = []
outline = []
references = ["packages/agent/extensions/checkpoint/index.ts"]
