name = "Runtime Context"
description = "Register Soul's runtime environment source with a local display date and frozen depth-2 root snapshot"

[extension-shell]
description = "Register the runtime environment source; Soul captures the current display date and root snapshot in its baseline and refreshes them after compaction"
read = [
  "packages/agent/extensions/runtime-context/index.ts",
  "packages/agent/shared/prompt-contributions.ts",
  "packages/agent/shared/events.ts",
  "packages/agent/extensions/runtime-context/README.md",
]
show = []
outline = []
references = [
  "packages/agent/extensions/runtime-context/context.ts",
  "packages/agent/extensions/tau-help/help.md",
]

[snapshot]
description = "Build the depth-2 root listing and display-date text supplied by the runtime environment prompt source"
read = [
  "packages/agent/extensions/runtime-context/context.ts",
]
show = []
outline = []
references = [
  "packages/agent/extensions/runtime-context/index.ts",
]
