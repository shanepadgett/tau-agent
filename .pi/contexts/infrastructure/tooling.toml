name = "Repository tooling"
description = "Workspace manifests and automated repository checks"

[checks]
description = "Mise task graph and formatter, linter, type, test, and dead-code policies"
read = [
  ".fallowrc.jsonc",
  ".markdownlint-cli2.jsonc",
  ".oxfmtrc.jsonc",
  ".oxlintrc.jsonc",
  ".pi/extensions/.fallow-scope.ts",
  "mise.toml",
  "tsconfig.json",
]
outline = []
references = [".gitignore"]

[workspace]
description = "Root and package manifests plus npm behavior"
read = [".npmrc", ".pi/git/.gitignore", ".pi/npm/.gitignore", "package.json", "packages/agent/package.json"]
outline = []
references = []
