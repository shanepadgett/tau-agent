name: Grammar artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/agent/src/ast/grammars/**"
      - "packages/agent/scripts/build-grammars.ts"
      - "mise.toml"
      - ".github/workflows/grammars.yml"

permissions:
  contents: read

jobs:
  build:
    # arm64 to match the vendored artifacts; wasm codegen is not guaranteed
    # byte-identical across host arches, and the drift check compares bytes.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: npm ci --ignore-scripts
      - run: mise run grammars:build
      - name: Fail on artifact drift
        run: git diff --exit-code --stat -- packages/agent/src/ast/grammars
      - name: Smoke-test grammar loading
        run: npx vitest --run packages/agent/test/extensions/explore/grammars.test.ts
